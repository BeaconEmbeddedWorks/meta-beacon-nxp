# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
IMAGE_INSTALL:append = "\
		 dhrystone \
		 iperf3 \
		 glmark2 \
		 linpack \
		 memtester \
		 whetstone \ 
		 tslib \
		 tslib-conf \
		 tslib-tests \
		 tslib-calibrate \
		 pointercal \
		 bluez5 \
		 ntfs-3g \
		 ntfsprogs \
		 libntfs-3g \
		 gstreamer1.0-libav \
		 faac \
		 devmem2 \
		 spitools \
		 test-neon \
		 bridge-utils \
		 flashrom \
		 rng-tools \
		 sdma \
		 libgpiod \
		 libgpiod-tools \
		 tzdata \
		 imx-boot \
		 pointercal \
		 u-boot-fw-utils \
		 edid-decode \
		 lshw \
		 kernel-module-imx-gpu-viv \
		 cpufrequtils \
		 evtest \
		 i2c-tools \
		 ethtool \
		 "
# Meta-Freescale and meta-beacon-nxp maybe newer than meta-imx, so ignore a few recipes
BBMASK += "meta-imx/meta-bsp/recipes-bsp/imx-mkimage"
BBMASK += "meta-imx/meta-bsp/recipes-bsp/u-boot"
BBMASK += "meta-imx/meta-ml/recipes-libraries/arm-compute-library"

PREFERRED_VERSION_wayland:mx8mp-nxp-bsp = "1.22.0.imx"
PREFERRED_VERSION_wayland-protocols:mx8mp-nxp-bsp = "1.32.imx"
PREFERRED_VERSION_kernel-module-imx-gpu-viv = "6.4.11.p2.2.2"
PREFERRED_VERSION_imx-gpu-viv = "6.4.11.p2.2.2-aarch64"
PREFERRED_VERSION_weston:mx8mp-nxp-bsp = "10.0.5.imx"
PREFERRED_VERSION_gfxreconstruct = "1.3.239.0"
PREFERRED_VERSION_vulkan-loader = "1.3.239.0.imx"
PREFERRED_VERSION_vulkan-validation-layers = "1.3.239.0.imx"
PREFERRED_VERSION_libdrm:mx8mp-nxp-bsp = "2.4.114.imx"

# The iMX8M Mini and Nano use the Laird Wifi modules
# The iMX8M Plus is not a Laird Wifi module has a different
# wifi vendor.  These are vendor specific components added
# to the recipe only for the following platforms

#IMAGE_INSTALL:append:mx8mm-nxp-bsp = "\
#		 kernel-module-lwb-backports-laird \
#		 lwb5-fcc-firmware \
#		 sterling-supplicant-lwb \
#		 wireless-regdb-static \
#		 "

#IMAGE_INSTALL:append:mx8mn-nxp-bsp = "\
#		 kernel-module-lwb-backports-laird \
#		 lwb5-fcc-firmware \
#		 sterling-supplicant-lwb \
#		 wireless-regdb-static \
#		 "

KERNEL_MODULE_AUTOLOAD:append:mx8mp-nxp-bsp = "\
		moal \
		"

KERNEL_MODULE_AUTOLOAD:append:mx8mm-nxp-bsp = "\
		ov5640 \
		"

KERNEL_MODULE_AUTOLOAD:append:mx8mn-nxp-bsp = "\
		ov5640 \
		"

KERNEL_MODULE_PROBECONF:append:mx8mp-nxp-bsp = "moal"
module_conf_moal = "options moal mod_para=nxp/wifi_mod_para.conf drvdbg=0x206"

MACHINE_EXTRA_RRECOMMENDS:remove:mx8mm-nxp-bsp = " ${@bb.utils.contains('MACHINE_FEATURES', 'nxp8987', 'nxp-wlan-sdk kernel-module-nxp89xx', '', d)}"
MACHINE_EXTRA_RRECOMMENDS:remove:mx8mm-nxp-bsp = " ${@bb.utils.contains('MACHINE_FEATURES', 'nxp8997', 'nxp-wlan-sdk kernel-module-nxp89xx', '', d)}"

MACHINE_EXTRA_RRECOMMENDS:remove:mx8mn-nxp-bsp = " ${@bb.utils.contains('MACHINE_FEATURES', 'nxp8987', 'nxp-wlan-sdk kernel-module-nxp89xx', '', d)}"
MACHINE_EXTRA_RRECOMMENDS:remove:mx8mn-nxp-bsp = " ${@bb.utils.contains('MACHINE_FEATURES', 'nxp8997', 'nxp-wlan-sdk kernel-module-nxp89xx', '', d)}"

MACHINE_EXTRA_RRECOMMENDS:remove:mx8mp-nxp-bsp = " ${@bb.utils.contains('MACHINE_FEATURES', 'nxp8987', 'nxp-wlan-sdk', '', d)}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-beacon-nxp"
BBFILE_PATTERN_meta-beacon-nxp = "^${LAYERDIR}/"
BBFILE_PRIORITY:meta-beacon-nxp = "6"

#BBFILES_DYNAMIC += " \
#	laird-cp:${LAYERDIR}/dynamic-layers/backports-laird/*.bbappend \
#	laird-cp:${LAYERDIR}/dynamic-layers/radio-firmware/*.bbappend \
#	"

VIRTUAL-RUNTIME_syslog = ""
BBMASK += "sysklogd"

RDEPENDS:packagegroup-fsl-tools-testapps:remove = "fsl-rc-local"
RDEPENDS:packagegroup-imx-core-tools:remove = "fsl-rc-local"
BBMASK += "recipes-fsl/fsl-rc-local"

LAYERSERIES_COMPAT_meta-beacon-nxp = "kirkstone honister warrior hardknott zeus"
LICENSE_FLAGS_ACCEPTED = "commercial"
