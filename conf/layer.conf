# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

IMAGE_INSTALL:append = "\
	sdma \
	${@bb.utils.contains('MACHINE_FEATURES', 'wifi', 'nxp-wifi-systemd', '', d)} \
	${@bb.utils.contains('MACHINE_FEATURES', 'bluetooth', 'nxp-bluetooth-systemd', '', d)} \
		 "
KERNEL_MODULE_AUTOLOAD += "sdma"

LAYERSERIES_COMPAT_meta-beacon-nxp = "scarthgap"
LICENSE_FLAGS_ACCEPTED = "commercial"
